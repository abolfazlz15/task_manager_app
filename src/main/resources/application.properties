spring.application.name=task_manager_app
spring.jpa.hibernate.ddl-auto=update

# db
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# log
logging.level.root=error
logging.file.name=logs/application.log
logging.pattern.file=%d{dd-MMM-yyyy HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n%ex{5}
spring.main.banner-mode=off

# redis
spring.data.redis.host=${REDIS_URL}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# otp
otp.default-length=${OTP_LENGTH}
otp.default-ttl=${OTP_TTL}
otp.max-attempt-length=${MAX_ATTEMPT_LENGTH}

app.jwt.secret=3f7d9e1b4c62a8e04fb52cd9f9a1736ba28d5f904c6ee1b8c7d4f21b8df4e9a1
app.jwt.expiration=36000000000000000
session.secret=mySuperSecretKey
session.salt=myRandomSalt
session.expiresIn=604800
# mail
spring.mail.host=${MAIL_HOST}
spring.mail.protocol=${MAIL_PROTOCOL}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}

# TLS
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

