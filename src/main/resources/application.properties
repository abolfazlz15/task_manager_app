spring.application.name=task_manager_app

# db
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# log
logging.level.root=error
spring.main.banner-mode=off

# redis
spring.data.redis.host=${REDIS_URL}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# otp
otp.default-length=${OTP_LENGTH}
otp.default-ttl=${OTP_TTL}
otp.max-attempt-length=${MAX_ATTEMPT_LENGTH}

# mail
spring.mail.host=${MAIL_HOST}
spring.mail.protocol=${MAIL_PROTOCOL}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}

# TLS
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

# SSL
# spring.mail.port=${MAIL_PORT:465}
# spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
